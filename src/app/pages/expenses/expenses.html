<p-table [value]="transaction">
    <ng-template #header>
        <tr>
            <td>Date</td>
            <td>Description</td>
            <td>Amount</td>
            <td>Category</td>
        </tr>        
    </ng-template>
    <ng-template #body let-transaction>
        <tr>
            <td>{{transaction.date}}</td>
            <td>{{transaction.recipient}}</td>
            <td>{{transaction.amount}}</td>
            <td>{{transaction.amount}}</td>
        </tr> 
    </ng-template>

</p-table>
