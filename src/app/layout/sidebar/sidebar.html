<div class="fixed left-0 top-0 flex h-screen w-full max-w-[20rem] flex-col bg-white dark:bg-blue-gray-800 bg-clip-border p-4 text-gray-700 dark:text-gray-200 shadow-xl shadow-blue-gray-900/5">
  <!-- Sidebar Header -->
  <div class="p-4 mb-2">
    <h5 class="block font-sans text-xl antialiased font-semibold leading-snug tracking-normal text-blue-gray-900 dark:text-white">
      InsightBoard
    </h5>
  </div>

  <!-- Navigation -->
  <nav class="flex min-w-[240px] flex-col gap-1 p-2 font-sans text-base font-normal text-blue-gray-700 dark:text-blue-gray-300">
    
    <!-- Dashboard Section (Collapsible) -->
    <div class="relative block w-full">
      <div role="button" class="flex items-center w-full p-0 leading-tight transition-all rounded-lg outline-none bg-blue-gray-50/50 dark:bg-blue-gray-700/50 text-start text-blue-gray-700 dark:text-blue-gray-200 hover:bg-blue-gray-50 dark:hover:bg-blue-gray-700 hover:bg-opacity-80 hover:text-blue-gray-900 dark:hover:text-white focus:bg-blue-gray-50 dark:focus:bg-blue-gray-700 focus:bg-opacity-80 focus:text-blue-gray-900 dark:focus:text-white active:bg-blue-gray-50 dark:active:bg-blue-gray-700 active:bg-opacity-80 active:text-blue-gray-900 dark:active:text-white">
        <button type="button" (click)="toggleSection('dashboard')" class="flex items-center justify-between w-full p-3 font-sans text-xl antialiased font-semibold leading-snug text-left transition-colors border-b-0 select-none border-b-blue-gray-100 dark:border-b-blue-gray-700 text-blue-gray-900 dark:text-white hover:text-blue-gray-900 dark:hover:text-white">
          <div class="grid mr-4 place-items-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <path fill-rule="evenodd" d="M2.25 2.25a.75.75 0 000 1.5H3v10.5a3 3 0 003 3h1.21l-1.172 3.513a.75.75 0 001.424.474l.329-.987h8.418l.33.987a.75.75 0 001.422-.474l-1.17-3.513H18a3 3 0 003-3V3.75h.75a.75.75 0 000-1.5H2.25zm6.04 16.5l.5-1.5h6.42l.5 1.5H8.29zm7.46-12a.75.75 0 00-1.5 0v6a.75.75 0 001.5 0v-6zm-3 2.25a.75.75 0 00-1.5 0v3.75a.75.75 0 001.5 0V9zm-3 2.25a.75.75 0 00-1.5 0v1.5a.75.75 0 001.5 0v-1.5z" clip-rule="evenodd"></path>
            </svg>
          </div>
          <p class="block mr-auto font-sans text-base antialiased font-normal leading-relaxed text-blue-gray-900">
            Dashboard
          </p>
          <span class="ml-4">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 mx-auto transition-transform" [class.rotate-180]="expandedSections['dashboard']">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path>
            </svg>
          </span>
        </button>
      </div>
      <div class="overflow-hidden" [class.hidden]="!expandedSections['dashboard']">
        <div class="block w-full py-1 font-sans text-sm antialiased font-light leading-normal text-gray-700 dark:text-gray-300">
          <nav class="flex min-w-[240px] flex-col gap-1 p-0 font-sans text-base font-normal text-blue-gray-700 dark:text-blue-gray-300">
            <a [routerLink]="['/analytics']" routerLinkActive="bg-blue-gray-50 dark:bg-blue-gray-700" class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 dark:hover:bg-blue-gray-700 hover:bg-opacity-80 hover:text-blue-gray-900 dark:hover:text-white focus:bg-blue-gray-50 dark:focus:bg-blue-gray-700 focus:bg-opacity-80 focus:text-blue-gray-900 dark:focus:text-white active:bg-blue-gray-50 dark:active:bg-blue-gray-700 active:bg-opacity-80 active:text-blue-gray-900 dark:active:text-white">
              <div class="grid mr-4 place-items-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-5 h-3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"></path>
                </svg>
              </div>
              Analytics
            </a>
            <a [routerLink]="['/dashboard']" routerLinkActive="bg-blue-gray-50 dark:bg-blue-gray-700" class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 dark:hover:bg-blue-gray-700 hover:bg-opacity-80 hover:text-blue-gray-900 dark:hover:text-white focus:bg-blue-gray-50 dark:focus:bg-blue-gray-700 focus:bg-opacity-80 focus:text-blue-gray-900 dark:focus:text-white active:bg-blue-gray-50 dark:active:bg-blue-gray-700 active:bg-opacity-80 active:text-blue-gray-900 dark:active:text-white">
              <div class="grid mr-4 place-items-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-5 h-3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"></path>
                </svg>
              </div>
              Overview
            </a>
            <a [routerLink]="['/recurring-calendar']" routerLinkActive="bg-blue-gray-50 dark:bg-blue-gray-700" class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 dark:hover:bg-blue-gray-700 hover:bg-opacity-80 hover:text-blue-gray-900 dark:hover:text-white focus:bg-blue-gray-50 dark:focus:bg-blue-gray-700 focus:bg-opacity-80 focus:text-blue-gray-900 dark:focus:text-white active:bg-blue-gray-50 dark:active:bg-blue-gray-700 active:bg-opacity-80 active:text-blue-gray-900 dark:active:text-white">
              <div class="grid mr-4 place-items-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-5 h-3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"></path>
                </svg>
              </div>
              Recurring Calendar
            </a>
          </nav>
        </div>
      </div>
    </div>

    <!-- Users Section (Collapsible) -->
    <div class="relative block w-full">
      <div role="button" class="flex items-center w-full p-0 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 dark:hover:bg-blue-gray-700 hover:bg-opacity-80 hover:text-blue-gray-900 dark:hover:text-white focus:bg-blue-gray-50 dark:focus:bg-blue-gray-700 focus:bg-opacity-80 focus:text-blue-gray-900 dark:focus:text-white active:bg-blue-gray-50 dark:active:bg-blue-gray-700 active:bg-opacity-80 active:text-blue-gray-900 dark:active:text-white">
        <button type="button" (click)="toggleSection('users')" class="flex items-center justify-between w-full p-3 font-sans text-xl antialiased font-semibold leading-snug text-left transition-colors border-b-0 select-none border-b-blue-gray-100 dark:border-b-blue-gray-700 text-blue-gray-700 dark:text-blue-gray-200 hover:text-blue-gray-900 dark:hover:text-white">
          <div class="grid mr-4 place-items-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
              <path d="M4.5 6.375a4.125 4.125 0 118.25 0 4.125 4.125 0 01-8.25 0zM14.25 8.625a3.375 3.375 0 116.75 0 3.375 3.375 0 01-6.75 0zM1.5 19.125a7.125 7.125 0 0114.25 0v.003l-.001.119a.75.75 0 01-.363.63 13.067 13.067 0 01-6.761 1.873c-2.472 0-4.786-.684-6.76-1.873a.75.75 0 01-.364-.63l-.001-.122zM17.25 19.128l-.001.144a2.25 2.25 0 01-.233.96 10.088 10.088 0 005.06-1.01.75.75 0 00.42-.643 4.875 4.875 0 00-6.957-4.611 8.586 8.586 0 011.71 5.157v.003z"></path>
            </svg>
          </div>
          <p class="block mr-auto font-sans text-base antialiased font-normal leading-relaxed text-blue-gray-900">
            Users
          </p>
          <span class="ml-4">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 mx-auto transition-transform" [class.rotate-180]="expandedSections['users']">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path>
            </svg>
          </span>
        </button>
      </div>
      <div class="overflow-hidden" [class.hidden]="!expandedSections['users']">
        <div class="block w-full py-1 font-sans text-sm antialiased font-light leading-normal text-gray-700 dark:text-gray-300">
          <nav class="flex min-w-[240px] flex-col gap-1 p-0 font-sans text-base font-normal text-blue-gray-700 dark:text-blue-gray-300">
            <a [routerLink]="['/users']" routerLinkActive="bg-blue-gray-50 dark:bg-blue-gray-700" class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 dark:hover:bg-blue-gray-700 hover:bg-opacity-80 hover:text-blue-gray-900 dark:hover:text-white focus:bg-blue-gray-50 dark:focus:bg-blue-gray-700 focus:bg-opacity-80 focus:text-blue-gray-900 dark:focus:text-white active:bg-blue-gray-50 dark:active:bg-blue-gray-700 active:bg-opacity-80 active:text-blue-gray-900 dark:active:text-white">
              <div class="grid mr-4 place-items-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" class="w-5 h-3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"></path>
                </svg>
              </div>
              All Users
            </a>
          </nav>
        </div>
      </div>
    </div>

    <hr class="my-2 border-blue-gray-50 dark:border-blue-gray-700" />

    <!-- Settings -->
    <a [routerLink]="['/settings']" routerLinkActive="bg-blue-gray-50 dark:bg-blue-gray-700" class="flex items-center w-full p-3 leading-tight transition-all rounded-lg outline-none text-start hover:bg-blue-gray-50 dark:hover:bg-blue-gray-700 hover:bg-opacity-80 hover:text-blue-gray-900 dark:hover:text-white focus:bg-blue-gray-50 dark:focus:bg-blue-gray-700 focus:bg-opacity-80 focus:text-blue-gray-900 dark:focus:text-white active:bg-blue-gray-50 dark:active:bg-blue-gray-700 active:bg-opacity-80 active:text-blue-gray-900 dark:active:text-white">
      <div class="grid mr-4 place-items-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
          <path fill-rule="evenodd" d="M11.078 2.25c-.917 0-1.699.663-1.85 1.567L9.05 4.889c-.02.12-.115.26-.297.348a7.493 7.493 0 00-.986.57c-.166.115-.334.126-.45.083L6.3 5.508a1.875 1.875 0 00-2.282.819l-.922 1.597a1.875 1.875 0 00.432 2.385l.84.692c.095.078.17.229.154.43a7.598 7.598 0 000 1.139c.015.2-.059.352-.153.43l-.841.692a1.875 1.875 0 00-.432 2.385l.922 1.597a1.875 1.875 0 002.282.818l1.019-.382c.115-.043.283-.031.45.082.312.214.641.405.985.57.182.088.277.228.297.35l.178 1.071c.151.904.933 1.567 1.85 1.567h1.844c.916 0 1.699-.663 1.85-1.567l.178-1.072c.02-.12.114-.26.297-.349.344-.165.673-.356.985-.57.167-.114.335-.125.45-.082l1.02.382a1.875 1.875 0 002.28-.819l.923-1.597a1.875 1.875 0 00-.432-2.385l-.84-.692c-.095-.078-.17-.229-.154-.43a7.614 7.614 0 000-1.139c-.016-.2.059-.352.153-.43l.84-.692c.708-.582.891-1.59.433-2.385l-.922-1.597a1.875 1.875 0 00-2.282-.818l-1.02.382c-.114.043-.282.031-.449-.083a7.49 7.49 0 00-.985-.57c-.183-.087-.277-.227-.297-.348l-.179-1.072a1.875 1.875 0 00-1.85-1.567h-1.843zM12 15.75a3.75 3.75 0 100-7.5 3.75 3.75 0 000 7.5z" clip-rule="evenodd"></path>
        </svg>
      </div>
      Settings
    </a>

  </nav>
</div>
