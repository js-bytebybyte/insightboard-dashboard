<header class="fixed top-0 left-[20rem] right-0 z-10 bg-white dark:bg-blue-gray-800 border-b border-blue-gray-100 dark:border-blue-gray-700 shadow-sm">
  <div class="flex items-center justify-between px-8 py-4">
    
    <!-- Left Side: Search Bar -->
    <div class="flex-1 max-w-2xl">
      <div class="relative">
        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-blue-gray-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>
        </div>
        <input 
          type="text" 
          placeholder="Search..." 
          class="w-full pl-10 pr-4 py-2 text-sm border border-blue-gray-200 dark:border-blue-gray-600 rounded-lg bg-white dark:bg-blue-gray-700 text-blue-gray-900 dark:text-blue-gray-100 placeholder-blue-gray-400 dark:placeholder-blue-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-gray-300 dark:focus:ring-blue-gray-500 focus:border-transparent transition-all"
        />
      </div>
    </div>

    <!-- Right Side: Actions & Profile -->
    <div class="flex items-center gap-4 ml-8">
      
      <!-- Dark Mode Toggle -->
      <button 
        type="button"
        (click)="toggleDarkMode()"
        class="p-2 text-blue-gray-600 dark:text-blue-gray-300 hover:bg-blue-gray-50 dark:hover:bg-blue-gray-800 rounded-lg transition-colors"
        title="Toggle dark mode"
      >
        <!-- Sun Icon (shown in dark mode) -->
        <svg *ngIf="isDarkMode" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
        </svg>
        <!-- Moon Icon (shown in light mode) -->
        <svg *ngIf="!isDarkMode" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
      </button>
      
      <!-- Notifications Button -->
      <div class="relative">
        <button 
          type="button"
          (click)="toggleNotifications()"
          class="relative p-2 text-blue-gray-600 hover:bg-blue-gray-50 rounded-lg transition-colors"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
          </svg>
          <!-- Notification Badge -->
          <span class="absolute top-1 right-1 flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
          </span>
        </button>

        <!-- Notifications Dropdown -->
        <div 
          *ngIf="showNotifications"
          class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-xl border border-blue-gray-100 overflow-hidden"
        >
          <div class="p-4 border-b border-blue-gray-100">
            <h3 class="font-semibold text-blue-gray-900">Notifications</h3>
          </div>
          <div class="max-h-96 overflow-y-auto">
            <div *ngFor="let notification of notifications" class="p-4 hover:bg-blue-gray-50 border-b border-blue-gray-50 cursor-pointer transition-colors">
              <div class="flex gap-3">
                <div class="flex-shrink-0">
                  <div class="w-10 h-10 rounded-full bg-blue-gray-100 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-blue-gray-600">
                      <path fill-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0021.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 003.065 7.097A9.716 9.716 0 0012 21.75a9.716 9.716 0 006.685-2.653zm-12.54-1.285A7.486 7.486 0 0112 15a7.486 7.486 0 015.855 2.812A8.224 8.224 0 0112 20.25a8.224 8.224 0 01-5.855-2.438zM15.75 9a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" clip-rule="evenodd" />
                    </svg>
                  </div>
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-medium text-blue-gray-900">{{ notification.title }}</p>
                  <p class="text-xs text-blue-gray-500 mt-1">{{ notification.message }}</p>
                  <p class="text-xs text-blue-gray-400 mt-1">{{ notification.time }}</p>
                </div>
              </div>
            </div>
          </div>
          <div class="p-3 text-center border-t border-blue-gray-100">
            <a href="#" class="text-sm text-blue-600 hover:text-blue-700 font-medium">View all notifications</a>
          </div>
        </div>
      </div>

      <!-- User Profile Dropdown -->
      <div class="relative">
        <button 
          type="button"
          (click)="toggleProfile()"
          class="flex items-center gap-3 p-2 hover:bg-blue-gray-50 rounded-lg transition-colors"
        >
          <div class="w-9 h-9 rounded-full bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 flex items-center justify-center text-white font-semibold">
            JD
          </div>
          <div class="hidden md:block text-left">
            <p class="text-sm font-medium text-blue-gray-900">John Doe</p>
            <p class="text-xs text-blue-gray-500">Admin</p>
          </div>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-blue-gray-400">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </button>

        <!-- Profile Dropdown Menu -->
        <div 
          *ngIf="showProfile"
          class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-xl border border-blue-gray-100 overflow-hidden"
        >
          <div class="p-4 border-b border-blue-gray-100">
            <p class="text-sm font-semibold text-blue-gray-900">John Doe</p>
            <p class="text-xs text-blue-gray-500 mt-1">john.doe@example.com</p>
          </div>
          <div class="py-2">
            <a [routerLink]="['/settings']" class="flex items-center gap-3 px-4 py-2 text-sm text-blue-gray-700 hover:bg-blue-gray-50 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              My Profile
            </a>
            <a [routerLink]="['/settings']" class="flex items-center gap-3 px-4 py-2 text-sm text-blue-gray-700 hover:bg-blue-gray-50 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              Settings
            </a>
          </div>
          <div class="border-t border-blue-gray-100">
            <button type="button" class="flex items-center gap-3 w-full px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
              </svg>
              Log Out
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>
</header>
